name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: adex

      - uses: actions/checkout@v4
        with:
          repository: ImmobilisCommander/Common
          token: ${{ secrets.COMMON_REPO_TOKEN }}
          path: Common

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: adex/global.json

      - name: Restore
        working-directory: adex/Adex
        run: |
          test -f ../../Common/Common.Telemetry/Common.Telemetry.csproj
          dotnet restore Adex.slnx

      - name: Build
        working-directory: adex/Adex
        run: dotnet build Adex.slnx --configuration Release --no-restore

      - name: Test
        working-directory: adex/Adex
        run: dotnet test --solution Adex.slnx --configuration Release --no-build --filter-not-trait "Category=Integration"
